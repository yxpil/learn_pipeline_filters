<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipeline architecture</title>
<style>body{margin:0;padding:16px;font-family:'Segoe UI',Arial,sans-serif;background:#fff;}svg{width:100%;height:auto;display:block;margin:0 auto;}</style>
</head>
<body>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <rect x="30" y="40" width="110" height="60" rx="10" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="85" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">upload</text>
  <text x="85" y="84" text-anchor="middle" font-size="11" fill="#b45309">file + meta</text>

  <line x1="140" y1="70" x2="170" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- filters -->
  <g font-size="12">
    <rect x="170" y="40" width="120" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="230" y="66" text-anchor="middle" font-weight="700" fill="#1d4ed8">validate</text><text x="230" y="84" text-anchor="middle" font-size="10.5" fill="#475569">type · size</text>
    <rect x="310" y="40" width="120" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="370" y="66" text-anchor="middle" font-weight="700" fill="#1d4ed8">virus_scan</text><text x="370" y="84" text-anchor="middle" font-size="10.5" fill="#475569">AV check</text>
    <rect x="450" y="40" width="120" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-dasharray="5 3"/><text x="510" y="66" text-anchor="middle" font-weight="700" fill="#6d28d9">watermark</text><text x="510" y="84" text-anchor="middle" font-size="10.5" fill="#7c3aed">(pluggable)</text>
    <rect x="590" y="40" width="120" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="650" y="66" text-anchor="middle" font-weight="700" fill="#1d4ed8">thumbnail</text><text x="650" y="84" text-anchor="middle" font-size="10.5" fill="#475569">gen thumbs</text>
    <rect x="730" y="40" width="120" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="790" y="66" text-anchor="middle" font-weight="700" fill="#1d4ed8">persist</text><text x="790" y="84" text-anchor="middle" font-size="10.5" fill="#475569">save to store</text>
    <rect x="870" y="40" width="110" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/><text x="925" y="66" text-anchor="middle" font-weight="700" fill="#1d4ed8">notify</text><text x="925" y="84" text-anchor="middle" font-size="10.5" fill="#475569">alert owner</text>
  </g>
  <g stroke="#475569" stroke-width="1.4">
    <line x1="290" y1="70" x2="310" y2="70" marker-end="url(#arr)"/>
    <line x1="430" y1="70" x2="450" y2="70" marker-end="url(#arr)"/>
    <line x1="570" y1="70" x2="590" y2="70" marker-end="url(#arr)"/>
    <line x1="710" y1="70" x2="730" y2="70" marker-end="url(#arr)"/>
    <line x1="850" y1="70" x2="870" y2="70" marker-end="url(#arr)"/>
  </g>

  <!-- early stop -->
  <line x1="230" y1="100" x2="230" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <text x="230" y="168" text-anchor="middle" font-size="11" fill="#b91c1c">bad type → stop, downstream skipped</text>
  <line x1="370" y1="100" x2="370" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrR)"/>
  <text x="370" y="168" text-anchor="middle" font-size="11" fill="#b91c1c">virus → stop</text>

  <!-- properties -->
  <rect x="30" y="210" width="950" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="505" y="238" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Properties</text>
  <text x="50" y="266" font-size="12" fill="#334155">• Each filter does ONE thing. Context dict flows through; filter reads what it needs, adds what it produces.</text>
  <text x="50" y="290" font-size="12" fill="#334155">• Pluggable: insert a new filter anywhere (e.g. watermark) without touching others.</text>
  <text x="50" y="314" font-size="12" fill="#334155">• Reorderable: rebuild the chain in any order.</text>
  <text x="50" y="338" font-size="12" fill="#334155">• Early stop: a filter raises StopPipeline; later filters never run.</text>
  <text x="50" y="362" font-size="12" fill="#334155">• Unix-pipe analog: cat log | grep ERROR | sort | uniq -c.</text>
</svg>
</body>
</html>
